name: humanitarian-data-platform

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: humanitarian
      POSTGRES_USER: humanitarian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanitarian -d humanitarian"]
      interval: 5s
      timeout: 5s
      retries: 20

  r-service:
    build: ./r-service
    restart: unless-stopped
    profiles: ["analytics"]
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  spool-init:
    image: hdp-runner-python:5.0.1
    build:
      context: ./runner
      dockerfile: Dockerfile.python
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /spool/staging /spool/pending/python /spool/pending/r
        /spool/running/python /spool/running/r /spool/completed/python
        /spool/completed/r /spool/heartbeat && chown -R 0:0 /spool
        && chmod 0711 /spool /spool/staging /spool/pending /spool/pending/python
        /spool/pending/r /spool/running /spool/running/python /spool/running/r
        /spool/completed /spool/completed/python /spool/completed/r /spool/heartbeat
        && chown -R 65532:65532 /spool
    volumes:
      - execution_spool:/spool
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  runner-python:
    image: hdp-runner-python:5.0.1
    build:
      context: ./runner
      dockerfile: Dockerfile.python
    restart: unless-stopped
    network_mode: none
    environment:
      HDP_SPOOL: /spool
      HDP_RUNNER_LANGUAGE: python
      HDP_RUNNER_COMMAND: /usr/local/bin/python3
      HDP_API_UID: "65532"
    volumes:
      - execution_spool:/spool
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      spool-init:
        condition: service_completed_successfully

  runner-r:
    image: hdp-runner-r:5.0.1
    build:
      context: ./runner
      dockerfile: Dockerfile.r
    restart: unless-stopped
    profiles: ["analytics"]
    network_mode: none
    environment:
      HDP_SPOOL: /spool
      HDP_RUNNER_LANGUAGE: r
      HDP_RUNNER_COMMAND: /usr/local/bin/Rscript
      HDP_API_UID: "65532"
    volumes:
      - execution_spool:/spool
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      spool-init:
        condition: service_completed_successfully

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://humanitarian:${POSTGRES_PASSWORD}@db:5432/humanitarian
      SQL_READER_URL: postgresql://hdp_reader:${HDP_SQL_PASSWORD}@db:5432/humanitarian
      HDP_SQL_PASSWORD: ${HDP_SQL_PASSWORD}
      DATA_DIR: /app/data
      R_SERVICE_URL: http://r-service:8001
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-}
      HDX_HAPI_APP_IDENTIFIER: ${HDX_HAPI_APP_IDENTIFIER:-}
      HDP_MAX_UPLOAD_BYTES: ${HDP_MAX_UPLOAD_BYTES:-536870912}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HDP_LOCAL_TOKEN: ${HDP_LOCAL_TOKEN}
      HDP_ALLOWED_HOSTS: ${HDP_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      EXECUTION_SPOOL_DIR: /app/execution_spool
      HDP_TILE_URL: ${HDP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    volumes:
      - ./data:/app/data
      - execution_spool:/app/execution_spool
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    ports:
      - "127.0.0.1:${HDP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      spool-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  execution_spool:
