name: HDP V7 global 10-cycle audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source/**"
      - "clients-v6/**"
      - "tools/v7_global_10cycle_audit.py"
      - ".github/workflows/v7-global-10cycle-audit.yml"

permissions:
  contents: read

jobs:
  global-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hdp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hdp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HDP_BACKUP_RESTORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hdp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r source/payload/api/requirements.txt
          python -m pip install pytest
          python -m pip install -e clients-v6/python
      - name: Compile all Python
        run: python -m compileall -q source/payload/api/app source/tests clients-v6/python/src clients-v6/python/tests tools
      - name: Full Python and PostgreSQL regression suite
        run: python -m unittest discover -s source/tests -p 'test_*.py'
      - name: Dedicated global audit regressions
        run: python -m unittest source/tests/test_v7_global_audit_regressions.py
      - name: Ten global development-audit cycles
        run: python tools/v7_global_10cycle_audit.py
      - name: Epidemiology acceptance
        run: |
          python tools/epidemiology_acceptance.py
          python tools/epidemiology_reference_acceptance.py
      - name: Security static checks
        run: python tools/security_static_checks.py
      - name: V7 dual connector architecture qualification
        run: python tools/v7_dual_connector_architecture_qualification.py
      - name: V7 release-readiness audit
        run: python tools/v7_release_readiness.py
      - name: Upload global audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: HDP-V7-global-10cycle-audit
          path: qualification-state/*
          retention-days: 90

  windows-exe:
    needs: global-audit
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build audited V7 installer
        shell: pwsh
        run: ./source/build-windows-v7.ps1
      - name: Validate PE32+ x64 and SHA-256
        shell: pwsh
        run: |
          $exe = "source/windows-build-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "EXE absent" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Signature MZ invalide" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw "Signature PE invalide" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Machine PE inattendue: $machine" }
          $sidecar = "$exe.sha256"
          if (-not (Test-Path -LiteralPath $sidecar)) { throw "SHA-256 sidecar absent" }
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content -Raw -LiteralPath $sidecar) -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA-256 incohérent" }
          Write-Host "Qualified EXE SHA-256: $actual"
      - name: Upload audited EXE
        uses: actions/upload-artifact@v4
        with:
          name: HDP-V7-global-audited-EXE
          path: |
            source/windows-build-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe
            source/windows-build-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe.sha256
          retention-days: 90
