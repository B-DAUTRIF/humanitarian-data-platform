name: HDP V7 full qualification

on:
  workflow_dispatch:
  pull_request:
    paths: ["source/**", "clients-v6/**", "tools/v7_*.py", "docs/**", "releases/v7.0.0-rc1/**", ".github/workflows/windows-v7-full.yml"]

permissions:
  contents: read

jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deterministic_ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          pip install -r source/payload/api/requirements.txt
          pip install -e clients-v6/python
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q source/payload/api/app source/tests clients-v6/python/src clients-v6/python/tests tools
      - name: ReliefWeb and World Bank deterministic tests
        run: >-
          python -m unittest
          source/tests/test_semantic_router.py
          source/tests/test_semantic_provider_execution.py
          source/tests/test_semantic_project_context.py
          source/tests/test_v7_semantic_jobs.py
          source/tests/test_v7_semantic_input_contract.py
          source/tests/test_v7_semantic_provenance_security.py
          source/tests/test_v7_use_case_matrix.py
          source/tests/test_reliefweb_v2.py
          source/tests/test_provider_reliefweb_architecture.py
          source/tests/test_reliefweb_use_case_qualification.py
          source/tests/test_provider_world_bank_health_architecture.py
      - name: ReliefWeb per-feature qualification
        run: python tools/v7_reliefweb_use_case_qualification.py
      - name: World Bank per-feature qualification
        run: python tools/v7_world_bank_health_use_case_qualification.py
      - name: Ten complete HDP architecture cycles with both new connectors
        run: python tools/v7_dual_connector_architecture_qualification.py
      - name: Offline V7 release-readiness audit
        run: python tools/v7_release_readiness.py
      - name: Legacy V6 quality gate remains green
        run: python tools/run_v6_quality_gate.py
      - name: Mark deterministic candidate ready
        id: readiness
        shell: bash
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Live provider sentinel
        continue-on-error: true
        run: python tools/v7_semantic_live_acceptance.py
      - name: Live ReliefWeb acceptance
        continue-on-error: true
        run: python tools/v7_reliefweb_live_acceptance.py
      - name: Live World Bank acceptance
        run: python tools/v7_world_bank_health_live_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HDP-V7-dual-connector-qualification
          path: qualification-state/*
          retention-days: 90

  windows-installer-v7:
    runs-on: windows-2025
    timeout-minutes: 40
    needs: semantic-contracts
    if: needs.semantic-contracts.outputs.deterministic_ready == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build V7 installer from isolated versioned build tree
        shell: pwsh
        run: ./source/build-windows-v7.ps1 -OutputDirectory "${{ runner.temp }}/hdp-v7"
      - name: Validate PE32+ and hashes
        shell: pwsh
        run: |
          $exe = "${{ runner.temp }}/hdp-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe"
          if (-not (Test-Path $exe)) { throw "V7 installer missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Missing MZ header" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $recorded = ((Get-Content "$exe.sha256" -Raw).Split()[0]).ToLowerInvariant()
          if ($hash -ne $recorded) { throw "SHA256 sidecar mismatch" }
      - name: Create complete V7 archive and provenance manifests
        shell: pwsh
        run: |
          $exe = "${{ runner.temp }}/hdp-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe"
          $exeSidecar = "$exe.sha256"
          $archive = "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v7.0.0.zip"
          $archiveSidecar = "$archive.sha256"
          $manifest = "${{ runner.temp }}/HDP_V7_ARTIFACT_MANIFEST.json"
          $stage = Join-Path $env:RUNNER_TEMP "HDP_V7"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe $stage; Copy-Item $exeSidecar $stage
          Copy-Item -Recurse source (Join-Path $stage "Sources")
          Copy-Item -Recurse clients-v6 (Join-Path $stage "Clients_R_Python")
          Copy-Item -Recurse docs (Join-Path $stage "Documentation")
          Copy-Item -Recurse tools (Join-Path $stage "Tools")
          Copy-Item -Recurse releases (Join-Path $stage "Release_Trace")
          Copy-Item README.md $stage
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{schema_version=1;release="7.0.0-user-test-rc";qualification="dual-connectors-deterministic-qualified-reliefweb-live-may-be-pending";repository=$env:GITHUB_REPOSITORY;commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID;generated_at_utc=[DateTime]::UtcNow.ToString("o");installer=[ordered]@{filename="HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe";sha256=$exeHash}} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $stage "BUILD_PROVENANCE_V7.json")
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  HumanitarianDataPlatform_Archive_complete_v7.0.0.zip" | Set-Content -Encoding ascii $archiveSidecar
          [ordered]@{schema_version=1;release="7.0.0-user-test-rc";qualification="dual-connectors-deterministic-qualified-reliefweb-live-may-be-pending";repository=$env:GITHUB_REPOSITORY;commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID;generated_at_utc=[DateTime]::UtcNow.ToString("o");artifacts=@([ordered]@{filename="HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe";sha256=$exeHash},[ordered]@{filename="HumanitarianDataPlatform_Archive_complete_v7.0.0.zip";sha256=$archiveHash})} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $manifest
      - uses: actions/upload-artifact@v4
        with:
          name: HDP-V7-user-test-RC
          path: |
            ${{ runner.temp }}/hdp-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe
            ${{ runner.temp }}/hdp-v7/HumanitarianDataPlatform_Setup_Native_GUI_v7.0.0.exe.sha256
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v7.0.0.zip
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v7.0.0.zip.sha256
            ${{ runner.temp }}/HDP_V7_ARTIFACT_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
