name: HDP validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: hdp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hdp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HDP_BACKUP_RESTORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hdp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer les dépendances de recette
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -r source/payload/api/requirements.txt
          python -m pip install playwright
      - name: Couverture exhaustive des cas d'usage V6
        run: python tools/v6_use_case_gate.py
      - name: Tests Python et PostgreSQL
        run: python -m unittest discover -s source/tests -p 'test_*.py'
      - name: Recettes épidémiologiques V6
        run: |
          python tools/epidemiology_acceptance.py
          python tools/epidemiology_reference_acceptance.py
      - name: Finalisation canonique des sources V6
        run: python tools/finalize_v6.py
      - name: Compilation Python
        run: python -m compileall -q source/payload/api/app source/payload/github-api source/tests tools
      - name: Syntaxe JavaScript
        run: node tools/check_inline_javascript.mjs source/payload/api/static/index.html
      - name: Contrat Compose
        run: docker compose -f source/payload/compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          HDP_LOCAL_TOKEN: ci-local-token-00000000000000000000000000000000
          HDP_SQL_PASSWORD: ci-sql-token-000000000000000000000000000000000
      - name: Recette navigateur UI/API réelle
        timeout-minutes: 8
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/humanitarian
          SQL_READER_URL: postgresql://postgres:postgres@127.0.0.1:5432/humanitarian
          HDP_LOCAL_TOKEN: ci-browser-token-00000000000000000000000000000000
          HDP_SQL_PASSWORD: ci-browser-sql-password-000000000000000000000000000000
          HDP_AUTH_MODE: local_token
          DATA_DIR: /tmp/hdp-browser-data
          EXECUTION_SPOOL_DIR: /tmp/hdp-browser-spool
          PYTHONPATH: source/payload/api
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE humanitarian;'
          python -m uvicorn app.main_v6:app --host 127.0.0.1 --port 18080 >/tmp/hdp-browser-api.log 2>&1 &
          API_PID=$!
          cleanup(){ kill "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            if ! kill -0 "$API_PID" 2>/dev/null; then cat /tmp/hdp-browser-api.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null || { cat /tmp/hdp-browser-api.log; exit 1; }
          python tools/browser_ui_e2e.py --base-url http://127.0.0.1:18080 --token "$HDP_LOCAL_TOKEN"
          cat /tmp/hdp-browser-api.log
      - name: Images R, client R et initialisation du spool
        timeout-minutes: 20
        run: |
          docker compose -f source/payload/compose.yaml --profile analytics build r-service runner-python
          docker compose -f source/payload/compose.yaml --profile analytics run --rm --no-deps --entrypoint Rscript r-service -e "stopifnot(requireNamespace('plumber', quietly=TRUE), requireNamespace('jsonlite', quietly=TRUE), requireNamespace('httr2', quietly=TRUE), requireNamespace('writexl', quietly=TRUE), requireNamespace('testthat', quietly=TRUE))"
          docker compose -f source/payload/compose.yaml --profile analytics run --rm --no-deps -v "$PWD/clients-v6/R:/pkg:ro" --entrypoint Rscript r-service -e "lib <- '/tmp/hdp-r-lib'; dir.create(lib, recursive=TRUE, showWarnings=FALSE); status <- system2('R', c('CMD','INSTALL','-l',lib,'/pkg')); stopifnot(status == 0); .libPaths(c(lib,.libPaths())); library(testthat); library(HDPClientsR); test_dir('/pkg/tests/testthat', stop_on_failure=TRUE)"
          docker compose -f source/payload/compose.yaml up --no-build spool-init
          docker compose -f source/payload/compose.yaml down -v
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          HDP_LOCAL_TOKEN: ci-local-token-00000000000000000000000000000000
          HDP_SQL_PASSWORD: ci-sql-token-000000000000000000000000000000000
      - name: Runner C17
        run: gcc -std=c17 -O2 -Wall -Wextra -Werror source/payload/runner/runner.c -o /tmp/hdp-runner
      - name: Payload reproductible
        run: |
          node source/scripts/generate_payload.mjs source/payload /tmp/payload_generated.h
          test -s /tmp/payload_generated.h
          grep -q 'HDP_PAYLOAD_GENERATED_H' /tmp/payload_generated.h
      - name: Contrôles de sécurité statiques
        run: python tools/security_static_checks.py
      - name: Diff propre
        run: git diff --check
