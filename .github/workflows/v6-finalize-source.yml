name: HDP V6 finalize source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/v6-finalize-source.yml"]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Finaliser identité et interface V6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={'source/src/installer.c':[('6.0.0-dev','6.0.0')],'source/payload/api/app/source_registry.py':[('6.0.0-dev','6.0.0'),('HDP/6.0.0-dev','HDP/6.0.0')],'source/payload/api/app/main.py':[('6.0.0-dev','6.0.0')],'source/payload/api/static/index.html':[('6.0.0-dev','6.0.0')]}
          for name,pairs in replacements.items():
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              for old,new in pairs: s=s.replace(old,new)
              p.write_text(s,encoding='utf-8',newline='\n')
          ui=Path('source/payload/api/static/index.html'); s=ui.read_text(encoding='utf-8')
          if 'data-view="source-settings"' not in s: s=s.replace('<button data-view="sources">Sources sanitaires</button>','<button data-view="sources">Sources sanitaires</button>\n    <button data-view="source-settings">Paramètres des sources</button>\n    <button data-view="inventory">Inventaire API</button>')
          if 'id="view-inventory"' not in s:
              marker='  <section id="view-intelligence" class="view">'; section='''  <section id="view-inventory" class="view">\n    <div class="card"><h2>Inventaire API exhaustif</h2><p class="intro">Tous les paramètres inventoriés sont visibles. Le vert indique les paramètres effectivement mappés dans HDP ; les autres restent explicitement informatifs jusqu’à validation de leur adaptateur.</p><div class="actions"><a class="button" href="/api-inventory" target="_blank" rel="noopener">Ouvrir l’inventaire complet</a></div><iframe title="Inventaire API HDP V6" src="/api-inventory" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;margin-top:14px;background:white"></iframe></div>\n  </section>\n\n'''; s=s.replace(marker,section+marker)
          if 'id="ui-mode"' not in s:
              s=s.replace('<select id="project-select" aria-label="Projet actif"></select>','<select id="project-select" aria-label="Projet actif"></select>\n      <select id="ui-mode" aria-label="Mode d’interface" title="Mode d’interface"><option value="simple">Simple</option><option value="advanced">Avancé</option><option value="expert">Expert</option></select>')
              s=s.replace('</body>',"<script>(()=>{const m=document.getElementById('ui-mode');if(!m)return;const saved=localStorage.getItem('hdp-ui-mode')||'advanced';m.value=saved;document.body.dataset.uiMode=saved;m.addEventListener('change',()=>{document.body.dataset.uiMode=m.value;localStorage.setItem('hdp-ui-mode',m.value);});})();</script>\n</body>")
          ui.write_text(s,encoding='utf-8',newline='\n')
          audit=Path('tools/audit_v6_complete.py'); a=audit.read_text(encoding='utf-8'); needle='    path = re.sub(r"\\{[^}]+\\}", "{x}", path)\n    return path.rstrip("/") or "/"'; repl='    path = re.sub(r"\\{[^}]+\\}", "{x}", path)\n    path = re.sub(r"/\\d+(?=/|$)", "/{x}", path)\n    return path.rstrip("/") or "/"'; a=a.replace(needle,repl); audit.write_text(a,encoding='utf-8',newline='\n')
          PY
      - name: Générer inventaire vérifiable et documentation
        run: python tools/build_v6_inventory.py
      - name: Générer catalogue client R depuis l'inventaire
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          bases={'hdx':'https://data.humdata.org','reliefweb':'https://api.reliefweb.int','who-gho':'https://ghoapi.azureedge.net','world-bank-health':'https://api.worldbank.org','unicef-sdmx':'https://sdmx.data.unicef.org/ws/public/sdmxapi/rest','un-sdg':'https://unstats.un.org/SDGAPI','dhs':'https://api.dhsprogram.com','hdx-hapi':'https://hapi.humdata.org','unhcr':'https://api.unhcr.org/population/v1','gdacs':'https://www.gdacs.org/gdacsapi'}
          rows=[]
          for p in sorted(Path('source/payload/api/app/api_inventory_parts').glob('part*.jsonl')):
              rows += [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          groups=defaultdict(list)
          for r in rows:
              if r['Méthode']=='CONFIG': continue
              groups[(r['source_slug'],r['Source'],r['Opération'],r['Endpoint'])].append(r)
          ops=[]
          for i,((slug,source,name,endpoint),rs) in enumerate(sorted(groups.items()),1):
              methods=sorted({m.strip() for r in rs for m in str(r['Méthode']).split('/') if m.strip()})
              ep=endpoint
              base=bases.get(slug,'')
              if base and ep.startswith(base): ep=ep[len(base):] or '/'
              ops.append({'id':f'{slug}:{i:03d}','source':source,'source_slug':slug,'base_url':base,'endpoint':ep,'methods':methods,'safe_read':all(m in {'GET','HEAD'} for m in methods),'parameters':[{'name':r['Paramètre'],'location':r['Emplacement'],'type':r['Type'],'required':r.get('Obligatoire',False),'default':r.get('default'),'description':r.get('Description officielle / synthèse','')} for r in rs]})
          payload={'version':'6.0.0','sources':{s:True for s in sorted({r['Source'] for r in rows})},'operations':ops}
          out=Path('clients-v6/R/inst/extdata/operations.json'); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('R operations:',len(ops))
          PY
      - name: Contrôles statiques
        run: |
          python -m compileall -q source/payload/api/app tools
          grep -q 'APP_VERSION L"6.0.0"' source/src/installer.c
          grep -q 'REGISTRY_VERSION = "6.0.0"' source/payload/api/app/source_registry.py
          grep -q 'data-view="inventory"' source/payload/api/static/index.html
          grep -q 'data-view="source-settings"' source/payload/api/static/index.html
          grep -q 'value="expert"' source/payload/api/static/index.html
          test -s clients-v6/R/inst/extdata/operations.json
          test -n "$(find source/payload/api/app/api_inventory_parts -name 'part*.jsonl' -print -quit)"
      - name: Commit de qualification source
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/src/installer.c source/payload/api/app/source_registry.py source/payload/api/app/main.py source/payload/api/static/index.html source/payload/api/app/api_inventory_parts docs/versions/6.0.0 tools/audit_v6_complete.py clients-v6/R/inst/extdata/operations.json
          if git diff --cached --quiet; then echo 'Aucun changement'; exit 0; fi
          git commit -m 'fix(v6): finalize UI audit and R operation catalog'; git push origin HEAD:main
