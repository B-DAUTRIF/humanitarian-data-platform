name: Bootstrap HDP 4.0.0 source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/HDP-v4-bootstrap.zip"
      - ".github/workflows/bootstrap-hdp-v4.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish-final-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le commit de publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier et appliquer le gel HDP 4.0.0
        shell: bash
        run: |
          set -euo pipefail
          echo "63c73f56a3c61f6c373a7c62b3fbea750e7c52e364d8ddda21575ae5a674a813  bootstrap/HDP-v4-bootstrap.zip" | sha256sum -c -
          staging="$(mktemp -d)"
          unzip -q bootstrap/HDP-v4-bootstrap.zip -d "$staging"
          rsync -a "$staging/" ./
          node source/scripts/generate_payload.mjs source/payload source/src/payload_generated.h
          python -m unittest discover -s source/tests -p 'test_*.py'
          node tools/check_inline_javascript.mjs source/payload/api/static/index.html
          python tools/security_static_checks.py
          unlink bootstrap/HDP-v4-bootstrap.zip
          rmdir bootstrap
          unlink .github/workflows/bootstrap-hdp-v4.yml
          git diff --check

      - name: Publier le source final sur main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize Humanitarian Data Platform v4.0.0"
          git push origin HEAD:main

      - name: Déclencher la compilation Windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run windows-installer.yml --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
