name: HDP V6 Windows 10 x64 qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/windows10-v6-full.yml", ".github/workflows/windows11-v6-full.yml", "releases/v6.0.0-rc2/**", "source/**", "clients-v6/**", "tools/**", "VERSION", "HDP_STATE.json"]

permissions:
  contents: read

jobs:
  windows10-real-e2e:
    runs-on: [self-hosted, Windows, X64, windows-10, hdp-v6]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Confirmer Windows 10 x64
        shell: pwsh
        run: |
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) build $($os.BuildNumber) $($os.OSArchitecture)"
          if($os.Caption -notmatch 'Windows 10'){throw 'Runner Windows 10 réel obligatoire'}
          if($os.OSArchitecture -notmatch '64'){throw 'Runner x64 obligatoire'}
          $b=[int]$os.BuildNumber
          if($b -lt 19044 -or $b -ge 22000){throw "Build Windows 10 non qualifié: $b"}
      - name: Vérifier le binaire RC2 exact
        shell: pwsh
        run: |
          $exe="$PWD/releases/v6.0.0-rc2/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
          $hashFile="$exe.sha256"
          $published='dc828ddc31eea2efe8ace9aa585b64cad6770cbbd4bacf490e27918999d4dd1c'
          if(!(Test-Path $exe) -or !(Test-Path $hashFile)){throw 'Binaire RC2 ou hash absent'}
          $expected=((Get-Content $hashFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "SHA-256 RC2 invalide: $actual != $expected"}
          if($actual -ne $published){throw "Le binaire testé n'est pas l'asset RC2 publié: $actual"}
          ./tools/windows/windows10_compatibility_gate.ps1 -InstallerPath $exe
      - name: Recette Windows 10 réelle complète sur le binaire RC2 publié
        shell: pwsh
        timeout-minutes: 12
        run: ./tools/windows/windows10_full_e2e.ps1 -InstallerPath "$PWD/releases/v6.0.0-rc2/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
      - name: Produire preuve Windows 10
        shell: pwsh
        run: |
          $os=Get-CimInstance Win32_OperatingSystem
          $exe="$PWD/releases/v6.0.0-rc2/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
          $proof=[ordered]@{version='6.0.0';commit='${{ github.sha }}';status='passed';artifact='v6.0.0-rc2';os=$os.Caption;build=$os.BuildNumber;architecture=$os.OSArchitecture;installer_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()}
          $proof|ConvertTo-Json|Set-Content -Encoding utf8 "${{ runner.temp }}/WINDOWS10_QUALIFICATION.json"
          Get-Content "${{ runner.temp }}/WINDOWS10_QUALIFICATION.json"
      - uses: actions/upload-artifact@v4
        with:
          name: HDP-V6-Windows10-RC2-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/WINDOWS10_QUALIFICATION.json
          retention-days: 90
          if-no-files-found: error
