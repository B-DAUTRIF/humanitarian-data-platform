name: HDP V6 full Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/v6-installer-fix-20260829"]
    paths:
      - ".github/workflows/windows-v6-full.yml"
      - "source/**"
      - "clients-v6/**"
      - "docs/**"
      - "wiki/**"
      - "VERSION"
      - "HDP_STATE.json"
      - "CHANGELOG.md"
      - "TODO_Mises_a_jour_HDP.md"

permissions:
  contents: read

jobs:
  build-and-qualify-v6:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Préparer les métadonnées V6 sans altérer l'historique V5
        shell: pwsh
        run: |
          $c = Get-Content source/src/installer.c -Raw
          $c = $c -replace '#define APP_VERSION L"5\.0\.2"', '#define APP_VERSION L"6.0.0"'
          Set-Content source/src/installer.c -Value $c -Encoding utf8

          $rc = Get-Content source/src/installer.rc -Raw
          $rc = $rc -replace 'FILEVERSION 5,0,2,0', 'FILEVERSION 6,0,0,0'
          $rc = $rc -replace 'PRODUCTVERSION 5,0,2,0', 'PRODUCTVERSION 6,0,0,0'
          $rc = $rc -replace '"5\.0\.2"', '"6.0.0"'
          $rc = $rc -replace 'HumanitarianDataPlatform_Setup_Native_GUI_v5\.0\.2\.exe', 'HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe'
          Set-Content source/src/installer.rc -Value $rc -Encoding utf8

          $b = Get-Content source/build-windows.ps1 -Raw
          $b = $b -replace 'HumanitarianDataPlatform_Setup_Native_GUI_v5\.0\.2\.exe', 'HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe'
          $b = $b -replace '5\.0\.2\*', '6.0.0*'
          Set-Content source/build-windows.ps1 -Value $b -Encoding utf8

      - name: Construire l'installateur complet V6 avec MSVC x64
        shell: pwsh
        run: ./source/build-windows.ps1 -OutputDirectory "${{ runner.temp }}/hdp-v6-installer"

      - name: Vérifier structure PE, imports et métadonnées V6
        shell: pwsh
        run: |
          $exe = "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
          if (!(Test-Path $exe)) { throw "Installateur V6 absent" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object FullName -match 'Hostx64\\x64\\dumpbin\.exe$' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin x64 introuvable" }
          $headers = & $dumpbin.FullName /headers $exe | Out-String
          $imports = & $dumpbin.FullName /imports $exe | Out-String
          if ($headers -notmatch 'machine \(x64\)' -or $headers -notmatch 'Windows GUI') { throw 'PE x64 GUI invalide' }
          if ($imports -notmatch '(?i)KERNEL32\.dll') { throw 'Table d imports Windows absente' }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.FileVersion -notlike '6.0.0*' -or $vi.ProductVersion -notlike '6.0.0*') { throw "Version PE incorrecte: $($vi.FileVersion) / $($vi.ProductVersion)" }

      - name: Vérifier les composants V6 embarqués
        shell: pwsh
        run: |
          if (!(Test-Path source/payload/api/app/main_v6.py)) { throw 'main_v6.py absent' }
          if (!(Test-Path source/payload/api/app/github_sync.py)) { throw 'github_sync.py absent' }
          if (!(Test-Path clients-v6/R/DESCRIPTION)) { throw 'client R V6 absent' }
          $docker = Get-Content source/payload/api/Dockerfile -Raw
          if ($docker -notmatch 'app\.main_v6:app') { throw 'Le Dockerfile ne démarre pas le backend V6' }

      - name: Construire l'archive complète V6
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "HDP_V6"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe" $stage
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256" $stage
          Copy-Item -Recurse source/payload (Join-Path $stage "Linux_et_payload")
          Copy-Item -Recurse source (Join-Path $stage "Sources/source")
          if (Test-Path tools) { Copy-Item -Recurse tools (Join-Path $stage "Sources/tools") }
          Copy-Item -Recurse .github (Join-Path $stage "Sources/.github")
          Copy-Item -Recurse clients-v6 (Join-Path $stage "Clients_V6")
          if (Test-Path docs) { Copy-Item -Recurse docs (Join-Path $stage "Documentation") }
          if (Test-Path wiki) { Copy-Item -Recurse wiki (Join-Path $stage "Wiki") }
          Copy-Item README.md,CHANGELOG.md,TODO_Mises_a_jour_HDP.md,VERSION,HDP_STATE.json $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HumanitarianDataPlatform_Archive_complete_v6.0.0.zip" | Set-Content -Encoding ascii "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip.sha256"

      - name: Publier les livrables V6 qualifiés par le build Windows
        uses: actions/upload-artifact@v4
        with:
          name: HumanitarianDataPlatform-V6-complet
          path: |
            ${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe
            ${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
