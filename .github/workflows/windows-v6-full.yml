# Final V6 qualification: source-native 6.0.0, canonical JSONL inventory, real installer journey.
name: HDP V6 full Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "test/v6-semantic-router"]
    paths: [".github/workflows/windows-v6-full.yml", "source/**", "clients-v6/**", "docs/**", "tools/**", "VERSION", "HDP_STATE.json", "CHANGELOG.md", "TODO_Mises_a_jour_HDP.md"]
permissions: {contents: read}
jobs:
  build-and-qualify-v6:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Installer dépendances Python d'audit
        shell: pwsh
        run: pip install -r source/payload/api/requirements.txt pytest
      - name: Couverture exhaustive des cas d'usage V6
        shell: pwsh
        run: python tools/v6_use_case_gate.py
      - name: Générer et qualifier inventaire API V6
        shell: pwsh
        run: |
          python tools/build_v6_inventory.py
          python -c "import sys; sys.path.insert(0,'source/payload/api'); from app.api_inventory import inventory,sources; r=inventory(); s=sources(); assert len(r)==1020,r; assert s['sources']==10,s; assert s['operations']==196,s; assert s['supported']==228,s; assert s['informational']==792,s; print('API inventory:',len(r),'entries /',s['sources'],'sources /',s['operations'],'operations')"
      - name: Audit fonctionnel backend UI
        shell: pwsh
        run: python tools/audit_v6_complete.py
      - name: Recettes métier épidémiologie
        shell: pwsh
        run: |
          python tools/epidemiology_acceptance.py
          python tools/epidemiology_reference_acceptance.py
      - name: Finalisation canonique des sources V6
        shell: pwsh
        run: python tools/finalize_v6.py
      - name: Tests Python et routeur sémantique
        shell: pwsh
        run: |
          python -m compileall -q source/payload/api/app clients-v6/python
          python -m unittest discover -s source/tests -p 'test_semantic_router.py'
          pip install -e clients-v6/python
          if(Test-Path clients-v6/python/tests){ pytest -q clients-v6/python/tests }
      - name: Vérifier raccourci Bureau obligatoire
        shell: pwsh
        run: |
          $c=Get-Content source/src/installer.c -Raw
          if($c -notmatch 'create_desktop_shortcut' -or $c -notmatch 'CSIDL_DESKTOPDIRECTORY' -or $c -notmatch 'Humanitarian Data Platform\.lnk'){throw 'Création du raccourci Bureau absente'}
          if($c -notmatch 'if \(create_desktop_shortcut\(options->install_dir'){throw 'Raccourci Bureau non appelé pendant installation'}
      - name: Construire installateur V6 MSVC x64 Windows 10+
        shell: pwsh
        run: ./source/build-windows.ps1 -OutputDirectory "${{ runner.temp }}/hdp-v6-installer"
      - name: Vérifier PE et composants V6
        shell: pwsh
        run: |
          $exe="${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"; if(!(Test-Path $exe)){throw 'Installateur absent'}
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath; $dumpbin=Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse|? FullName -match 'Hostx64\\x64\\dumpbin\.exe$'|select -First 1
          $h=& $dumpbin.FullName /headers $exe|Out-String; $i=& $dumpbin.FullName /imports $exe|Out-String; if($h -notmatch 'machine \(x64\)' -or $h -notmatch 'Windows GUI' -or $i -notmatch '(?i)KERNEL32\.dll'){throw 'PE invalide'}
          $vi=(Get-Item $exe).VersionInfo; if($vi.FileVersion -notlike '6.0.0*' -or $vi.ProductVersion -notlike '6.0.0*'){throw 'Version PE incorrecte'}
          if(!(Get-ChildItem source/payload/api/app/api_inventory_parts -Filter 'part*.jsonl')){throw 'Inventaire JSONL absent'}
          if(Get-ChildItem source/payload/api/app/api_inventory_parts -Filter 'part*.txt'){throw 'Ancien inventaire compressé détecté'}
          $docker=Get-Content source/payload/api/Dockerfile -Raw; if($docker -notmatch 'app\.main_v6:app'){throw 'Backend V6 non actif'}
      - name: Compatibilité statique Windows 10 et Windows 11
        shell: pwsh
        run: ./tools/windows/windows10_compatibility_gate.ps1 -InstallerPath "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
      - name: Recette installateur Windows réelle sur runner complémentaire
        shell: pwsh
        timeout-minutes: 8
        run: ./tools/windows/windows_installer_e2e.ps1 -InstallerPath "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
      - name: Diagnostic installateur Windows en cas d'échec
        if: failure()
        shell: pwsh
        run: |
          Write-Host '--- Trace Docker contrôlé ---'
          $trace=Join-Path $env:RUNNER_TEMP 'hdp-fake-docker.log'
          if(Test-Path $trace){Get-Content $trace}else{Write-Host 'Aucune trace Docker contrôlée'}
          Write-Host '--- Journaux installateur ---'
          $logDir=Join-Path $env:LOCALAPPDATA 'HumanitarianDataPlatform\logs'
          if(Test-Path $logDir){Get-ChildItem $logDir -Filter 'installer-*.log' | Sort-Object LastWriteTime | ForEach-Object { Write-Host "### $($_.FullName)"; Get-Content $_.FullName }}else{Write-Host 'Répertoire de journaux absent'}
      - name: Construire archive complète V6
        shell: pwsh
        run: |
          $stage=Join-Path $env:RUNNER_TEMP 'HDP_V6'; New-Item -ItemType Directory -Force $stage|Out-Null
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe" $stage; Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256" $stage
          Copy-Item -Recurse source/payload (Join-Path $stage 'Linux_et_payload'); Copy-Item -Recurse source (Join-Path $stage 'Sources/source'); if(Test-Path tools){Copy-Item -Recurse tools (Join-Path $stage 'Sources/tools')}; Copy-Item -Recurse .github (Join-Path $stage 'Sources/.github'); Copy-Item -Recurse clients-v6 (Join-Path $stage 'Clients_V6'); if(Test-Path docs){Copy-Item -Recurse docs (Join-Path $stage 'Documentation')}; if(Test-Path wiki){Copy-Item -Recurse wiki (Join-Path $stage 'Wiki')}; Copy-Item README.md,CHANGELOG.md,TODO_Mises_a_jour_HDP.md,VERSION,HDP_STATE.json $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip" -CompressionLevel Optimal
          $hash=(Get-FileHash "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip" -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  HumanitarianDataPlatform_Archive_complete_v6.0.0.zip"|Set-Content -Encoding ascii "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip.sha256"
          Write-Host "Archive SHA-256 : $hash"
      - name: Publier livrables V6
        uses: actions/upload-artifact@v4
        with:
          name: HumanitarianDataPlatform-V6-complet
          path: |
            ${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe
            ${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
