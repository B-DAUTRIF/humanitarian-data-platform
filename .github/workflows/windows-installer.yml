name: HDP Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "source/build-windows.ps1"
      - "source/payload/**"
      - "source/scripts/generate_payload.mjs"
      - "source/src/installer.c"
      - "source/src/installer.manifest"
      - "source/src/installer.rc"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Construire et vérifier l'installateur PE32+ x64
        shell: pwsh
        run: ./source/build-windows.ps1 -OutputDirectory "${{ runner.temp }}/hdp-installer"

      - name: Construire l'archive complète V6 de développement
        shell: pwsh
        run: |
          python tools/package_v6_release.py `
            --installer "${{ runner.temp }}/hdp-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0-dev.exe" `
            --output-dir "${{ runner.temp }}/hdp-v6-artifacts"

      - name: Publier l'installateur et son empreinte
        uses: actions/upload-artifact@v4
        with:
          name: HumanitarianDataPlatform-V6-dev-complet
          path: |
            ${{ runner.temp }}/hdp-v6-artifacts/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0-dev.exe
            ${{ runner.temp }}/hdp-v6-artifacts/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0-dev.exe.sha256
            ${{ runner.temp }}/hdp-v6-artifacts/HumanitarianDataPlatform_Archive_complete_v6.0.0-dev.zip
            ${{ runner.temp }}/hdp-v6-artifacts/HumanitarianDataPlatform_Archive_complete_v6.0.0-dev.zip.sha256
          if-no-files-found: error
          retention-days: 30
