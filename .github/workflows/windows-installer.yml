name: HDP Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "source/build-windows.ps1"
      - "source/payload/**"
      - "source/scripts/generate_payload.mjs"
      - "source/src/installer.c"
      - "source/src/installer.manifest"
      - "source/src/installer.rc"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Construire et vérifier l'installateur PE32+ x64
        shell: pwsh
        run: ./source/build-windows.ps1 -OutputDirectory "${{ runner.temp }}/hdp-installer"

      - name: Construire l'archive complète V5
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "HDP_V5"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ runner.temp }}/hdp-installer/HumanitarianDataPlatform_Setup_Native_GUI_v5.0.0.exe" $stage
          Copy-Item "${{ runner.temp }}/hdp-installer/HumanitarianDataPlatform_Setup_Native_GUI_v5.0.0.exe.sha256" $stage
          Copy-Item -Recurse source/payload (Join-Path $stage "Linux_et_payload")
          Copy-Item -Recurse docs (Join-Path $stage "Documentation")
          Copy-Item -Recurse wiki (Join-Path $stage "Wiki")
          Copy-Item output/pdf/HDP_V5_Documentation_et_UML.pdf $stage
          Copy-Item HDP_Prompt_production_global_v5.0.0.txt $stage
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v5.0.0.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v5.0.0.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HumanitarianDataPlatform_Archive_complete_v5.0.0.zip" | Set-Content -Encoding ascii "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v5.0.0.zip.sha256"

      - name: Publier l'installateur et son empreinte
        uses: actions/upload-artifact@v4
        with:
          name: HumanitarianDataPlatform-V5-complet
          path: |
            ${{ runner.temp }}/hdp-installer/HumanitarianDataPlatform_Setup_Native_GUI_v5.0.0.exe
            ${{ runner.temp }}/hdp-installer/HumanitarianDataPlatform_Setup_Native_GUI_v5.0.0.exe.sha256
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v5.0.0.zip
            ${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v5.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
