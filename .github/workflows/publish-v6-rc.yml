name: Publish HDP V6 RC

on:
  push:
    branches: [main]
    paths:
      - "docs/versions/6.0.0/FINAL_TEST_REPORT.md"
      - ".github/workflows/publish-v6-rc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-rc:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer dépendances d'audit
        shell: pwsh
        run: pip install -r source/payload/api/requirements.txt pytest
      - name: Gate cas d'usage exhaustif
        shell: pwsh
        run: python tools/v6_use_case_gate.py
      - name: Inventaire et recettes métier
        shell: pwsh
        run: |
          python tools/build_v6_inventory.py
          python tools/audit_v6_complete.py
          python tools/epidemiology_acceptance.py
          python tools/epidemiology_reference_acceptance.py
          python tools/finalize_v6.py
      - name: Construire installateur Windows 10+ x64
        shell: pwsh
        run: ./source/build-windows.ps1 -OutputDirectory "${{ runner.temp }}/hdp-v6-installer"
      - name: Compatibilité statique Windows 10/11
        shell: pwsh
        run: |
          $exe="${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
          ./tools/windows/windows10_compatibility_gate.ps1 -InstallerPath $exe
          $proof=[ordered]@{
            version='6.0.0'
            commit='${{ github.sha }}'
            status='passed'
            target='_WIN32_WINNT=0x0A00;NTDDI_VERSION=0x0A000000;x64'
            policy='static Windows 10 baseline compatible; Windows 11 preserved'
            installer_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $proof|ConvertTo-Json|Set-Content -Encoding utf8 "${{ runner.temp }}/WINDOWS_STATIC_COMPATIBILITY.json"
      - name: Recette installateur complémentaire
        shell: pwsh
        timeout-minutes: 10
        run: ./tools/windows/windows_installer_e2e.ps1 -InstallerPath "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
      - name: Construire archive complète
        shell: pwsh
        run: |
          $stage=Join-Path $env:RUNNER_TEMP 'HDP_V6_RC'; New-Item -ItemType Directory -Force $stage|Out-Null
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe" $stage
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256" $stage
          Copy-Item -Recurse source/payload (Join-Path $stage 'Linux_et_payload')
          Copy-Item -Recurse source (Join-Path $stage 'Sources/source')
          if(Test-Path tools){Copy-Item -Recurse tools (Join-Path $stage 'Sources/tools')}
          Copy-Item -Recurse .github (Join-Path $stage 'Sources/.github')
          Copy-Item -Recurse clients-v6 (Join-Path $stage 'Clients_V6')
          if(Test-Path docs){Copy-Item -Recurse docs (Join-Path $stage 'Documentation')}
          if(Test-Path wiki){Copy-Item -Recurse wiki (Join-Path $stage 'Wiki')}
          Copy-Item README.md,CHANGELOG.md,TODO_Mises_a_jour_HDP.md,VERSION,HDP_STATE.json $stage
          $zip="${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip"|Set-Content -Encoding ascii "${zip}.sha256"
      - name: Préparer dossier GitHub dédié
        shell: pwsh
        run: |
          $drop='releases/v6.0.0-rc1'
          New-Item -ItemType Directory -Force $drop|Out-Null
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe" "$drop/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe"
          Copy-Item "${{ runner.temp }}/hdp-v6-installer/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256" "$drop/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256"
          Copy-Item "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip" "$drop/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip"
          Copy-Item "${{ runner.temp }}/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip.sha256" "$drop/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip.sha256"
          Copy-Item "docs/versions/6.0.0/FINAL_TEST_REPORT.md" "$drop/FINAL_TEST_REPORT.md"
          Copy-Item "${{ runner.temp }}/WINDOWS_STATIC_COMPATIBILITY.json" "$drop/WINDOWS_STATIC_COMPATIBILITY.json"
          @"
          # HDP V6.0.0 RC1
          Livrables construits par GitHub Actions depuis le commit source `${{ github.sha }}`.
          Cette RC satisfait toutes les portes automatisées/hébergées. La promotion `v6.0.0` reste bloquée jusqu'aux recettes réelles Windows 10 x64 et Windows 11 x64 sur le même état source.
          "@ | Set-Content -Encoding utf8 "$drop/README.md"
      - name: Publier le dossier de livraison dans main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v6.0.0-rc1
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){ git commit -m "release: publish HDP v6.0.0-rc1 binaries [skip ci]"; git push origin HEAD:main }
      - name: Créer ou mettre à jour la prerelease GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $drop='releases/v6.0.0-rc1'
          $assets=@(
            "$drop/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe",
            "$drop/HumanitarianDataPlatform_Setup_Native_GUI_v6.0.0.exe.sha256",
            "$drop/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip",
            "$drop/HumanitarianDataPlatform_Archive_complete_v6.0.0-rc1.zip.sha256",
            "$drop/FINAL_TEST_REPORT.md",
            "$drop/WINDOWS_STATIC_COMPATIBILITY.json"
          )
          gh release view v6.0.0-rc1 2>$null
          if($LASTEXITCODE -eq 0){
            gh release upload v6.0.0-rc1 @assets --clobber
            gh release edit v6.0.0-rc1 --title "HDP v6.0.0 RC1" --notes-file "$drop/README.md" --prerelease
          } else {
            gh release create v6.0.0-rc1 @assets --target main --title "HDP v6.0.0 RC1" --notes-file "$drop/README.md" --prerelease
          }
