name: HDP Clients V6 - R qualification

on:
  workflow_dispatch:
  push:
    branches: ["codex/v6-installer-fix-20260829"]
    paths:
      - "clients-v6/R/**"
      - ".github/workflows/clients-v6.yml"
  pull_request:
    paths:
      - "clients-v6/R/**"
      - ".github/workflows/clients-v6.yml"

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: clients-v6/R
          extra-packages: any::rcmdcheck
          needs: check
      - name: R CMD check
        run: rcmdcheck::rcmdcheck("clients-v6/R", args="--no-manual", error_on="warning")
        shell: Rscript {0}
